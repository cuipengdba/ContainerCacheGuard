name: File-cache fallback development
on:
  push:
    branches: [codex/cache-fallback-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: ccg-fallback-ci-only
          POSTGRES_DB: ccg_test
        ports: [5432:5432]
        options: --memory=512m --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Unit and race tests
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build static CCG and pinned upstream comparator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=0.2.0-dev.fallback -X main.commit=${GITHUB_SHA}" -o dist/containercacheguard .
          ! readelf -l dist/containercacheguard | grep -q INTERP
          ! readelf -d dist/containercacheguard | grep -q NEEDED
          curl --fail --retry 3 --silent --show-error --location 'https://raw.githubusercontent.com/hoytech/vmtouch/b8b30e81d51544d6b8f428552f10d5b398a77fcb/vmtouch.c' -o dist/vmtouch.c
          cc -O2 -static -o dist/vmtouch dist/vmtouch.c
      - name: Authorize backup from the runner in the disposable PostgreSQL service
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ccg-fallback-ci-only
          PGDATABASE: ccg_test
          TEST_PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          address="$(psql -XAt -v ON_ERROR_STOP=1 -c 'select host(inet_client_addr())')"
          [[ "$address" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker exec -u postgres "$TEST_PG_SERVICE" sh -ec '
            printf "host replication postgres %s/32 scram-sha-256\n" "$1" >> "$PGDATA/pg_hba.conf"
            pg_ctl -D "$PGDATA" reload
          ' sh "$address"
      - name: Compare original, bounded fallback and upstream vmtouch
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ccg-fallback-ci-only
          PGDATABASE: ccg_test
        run: sudo --preserve-env=PGHOST,PGPORT,PGUSER,PGPASSWORD,PGDATABASE python3 scripts/fallback_compare.py dist/containercacheguard dist/vmtouch --output fallback-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallback-dev-${{ matrix.arch }}
          path: fallback-results.json
