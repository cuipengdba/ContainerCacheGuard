# The example targets are TLS gateways forwarding to authenticated CCG HTTP listeners.
# Replace .example domains, mount the password file, and configure trusted TLS.
scrape_configs:
  - job_name: containercacheguard
    scrape_interval: 15s
    scrape_timeout: 5s
    scheme: https
    basic_auth:
      username: ccg
      password_file: /etc/prometheus/secrets/ccg-password
    static_configs:
      - targets: ['dbs-ccg.example:443']
        labels: {service: dbs}
      - targets: ['hisdbs-ccg.example:443']
        labels: {service: hisdbs}
      - targets: ['dbsbackup-ccg.example:443']
        labels: {service: dbsbackup}
      - targets: ['hisdbsbackup-ccg.example:443']
        labels: {service: hisdbsbackup}
